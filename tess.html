<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Profile Finder | Final Edition</title>
    <style>
        /* Modern UI Glassmorphism */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: radial-gradient(circle at center, #1e1e2f 0%, #111119 100%);
            color: #fff;
            padding: 20px;
        }
        .card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            padding: 40px;
            border-radius: 28px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            text-align: center;
            width: 100%;
            max-width: 450px;
        }
        h3 {
            font-size: 2em;
            margin-bottom: 25px;
            background: linear-gradient(135deg, #00d4ff, #9d50bb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .mode-toggle {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .mode-btn {
            flex: 1;
            padding: 10px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            color: rgba(255,255,255,0.6);
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
        }
        .mode-btn.active {
            background: #00d4ff22;
            border-color: #00d4ff;
            color: #00d4ff;
        }
        input {
            padding: 16px;
            width: 100%;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            font-size: 1em;
            outline: none;
            margin-bottom: 15px;
            transition: 0.3s;
        }
        input:focus { border-color: #00d4ff; box-shadow: 0 0 15px rgba(0, 212, 255, 0.2); }
        
        button#searchBtn {
            padding: 16px;
            background: linear-gradient(90deg, #007bff, #00d4ff);
            color: white;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            font-size: 1.1em;
            transition: 0.3s;
        }
        button#searchBtn:hover:not(:disabled) { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0, 123, 255, 0.4); }
        button#searchBtn:disabled { opacity: 0.5; cursor: not-allowed; }

        .spinner {
            display: none;
            width: 30px;
            height: 30px;
            border: 4px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            border-top-color: #00d4ff;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        #result {
            margin-top: 30px;
            display: none;
            animation: fadeIn 0.5s ease forwards;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        #avatar {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            border: 4px solid #00d4ff;
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.2);
            margin-bottom: 15px;
        }
        .verified-badge {
            color: #00d4ff;
            background: rgba(0, 212, 255, 0.1);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8em;
            display: inline-block;
            margin-top: 10px;
        }
        .status-msg { font-size: 0.9em; margin-top: 15px; padding: 10px; border-radius: 8px; }
        .error { background: rgba(255, 82, 82, 0.1); color: #ff5252; }
        .success { background: rgba(76, 175, 80, 0.1); color: #4caf50; }
    </style>
</head>
<body>

    <div class="card">
        <h3>🔍 Profile Finder</h3>
        
        <div class="mode-toggle">
            <button class="mode-btn active" id="btnUser" onclick="switchMode('username')">Username</button>
            <button class="mode-btn" id="btnId" onclick="switchMode('id')">User ID</button>
        </div>

        <input type="text" id="userInput" placeholder="Masukkan username..." onkeypress="if(event.key==='Enter') executeSearch()">
        <button id="searchBtn" onclick="executeSearch()">Cari Sekarang</button>
        
        <div class="spinner" id="loader"></div>
        <div id="stepLogger" style="font-size: 0.75em; color: gray; margin-top: 10px;"></div>

        <div id="result">
            <img id="avatar" src="" alt="Roblox Avatar">
            <h2 id="resDisplayName"></h2>
            <div id="resUsername" style="color: #00d4ff;"></div>
            <div id="resUserId" style="opacity: 0.5; font-size: 0.85em;"></div>
            <div id="resVerified"></div>
            <div id="statusBox" class="status-msg"></div>
        </div>
    </div>

    <script>
        let currentMode = 'username';
        const PROXY_LIST = [
            { name: "CORSProxy", url: (target) => `https://corsproxy.io/?${encodeURIComponent(target)}` },
            { name: "AllOrigins", url: (target) => `https://api.allorigins.win/raw?url=${encodeURIComponent(target)}` }
        ];

        function switchMode(mode) {
            currentMode = mode;
            document.getElementById('btnUser').classList.toggle('active', mode === 'username');
            document.getElementById('btnId').classList.toggle('active', mode === 'id');
            document.getElementById('userInput').placeholder = mode === 'username' ? "Masukkan username..." : "Masukkan angka ID...";
        }

        async function fetchWithRetry(targetUrl) {
            for (let proxy of PROXY_LIST) {
                try {
                    logStep(`Mencoba via ${proxy.name}...`);
                    const response = await fetch(proxy.url(targetUrl));
                    if (!response.ok) throw new Error("Gagal load");
                    return await response.json();
                } catch (e) {
                    console.warn(`${proxy.name} failed, trying next...`);
                }
            }
            throw new Error("Semua proxy gagal. Silakan coba lagi nanti.");
        }

        function logStep(msg) { document.getElementById('stepLogger').innerText = msg; }

        async function executeSearch() {
            const input = document.getElementById('userInput').value.trim();
            if (!input) return;

            // Reset UI
            const resDiv = document.getElementById('result');
            const loader = document.getElementById('loader');
            const btn = document.getElementById('searchBtn');
            resDiv.style.display = 'none';
            loader.style.display = 'block';
            btn.disabled = true;

            try {
                let userId = input;

                // Step 1: Convert Username to ID if needed
                if (currentMode === 'username') {
                    logStep("Mencari User ID...");
                    const searchData = await fetchWithRetry(`https://users.roblox.com/v1/users/search?keyword=${input}&limit=1`);
                    if (!searchData.data || searchData.data.length === 0) throw new Error("User tidak ditemukan.");
                    userId = searchData.data[0].id;
                }

                // Step 2: Get Profile Detail
                logStep("Mengambil data profil...");
                const userData = await fetchWithRetry(`https://users.roblox.com/v1/users/${userId}`);

                // Step 3: Get Avatar
                logStep("Mengambil avatar...");
                const thumbData = await fetchWithRetry(`https://thumbnails.roblox.com/v1/users/avatar-headshot?userIds=${userId}&size=420x420&format=Png`);

                // Update UI
                document.getElementById('resDisplayName').innerText = userData.displayName;
                document.getElementById('resUsername').innerText = `@${userData.name}`;
                document.getElementById('resUserId').innerText = `ID: ${userData.id}`;
                document.getElementById('avatar').src = thumbData.data[0].imageUrl;
                document.getElementById('resVerified').innerHTML = userData.hasVerifiedBadge ? '<span class="verified-badge">✓ Verified Artist/Creator</span>' : '';
                
                const statusBox = document.getElementById('statusBox');
                statusBox.innerText = "Profil berhasil ditemukan!";
                statusBox.className = "status-msg success";

                resDiv.style.display = 'block';
                logStep("");
            } catch (err) {
                alert(err.message);
                logStep("Gagal.");
            } finally {
                loader.style.display = 'none';
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
