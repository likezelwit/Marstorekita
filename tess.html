<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marstorekita - Payment</title>
    
    <script src="https://www.paypal.com/sdk/js?client-id=Abs1uneKUaR7cv_AJLNk3k_gTtsW7GPjWaIGEAht17qttFfzc97BGnUoFNVx6QiHNzT9dRGDmpa8bclk&currency=USD"></script>

    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #f4f7f6; margin: 0; }
        .payment-box { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; width: 350px; }
        .price { font-size: 24px; font-weight: bold; color: #111; margin-bottom: 20px; }
    </style>
</head>
<body>

    <div class="payment-box">
        <h3>Pembayaran Marstorekita</h3>
        <div class="price">$10.00</div>
        <div id="paypal-button-container"></div>
    </div>

    <script>
        if (window.paypal) {
            paypal.Buttons({
                createOrder: function(data, actions) {
                    return actions.order.create({
                        purchase_units: [{ amount: { value: '10.00' } }]
                    });
                },
                onApprove: function(data, actions) {
                    return actions.order.capture().then(function(details) {
                        alert('Transaksi Sukses! Halo ' + details.payer.name.given_name);
                    });
                }
            }).render('#paypal-button-container');
        } else {
            document.getElementById('paypal-button-container').innerHTML = 'Gagal memuat PayPal. Cek koneksi.';
        }
    </script>
</body>
</html>
