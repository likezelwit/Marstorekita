<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Profile Finder - Anti CORS</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; align-items: center; padding: 50px; background: #f4f7f9; }
        .card { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; width: 320px; border: 1px solid #e1e4e8; }
        input { padding: 12px; width: 85%; border: 2px solid #eee; border-radius: 10px; margin-bottom: 12px; outline: none; transition: 0.3s; }
        input:focus { border-color: #007bff; }
        button { padding: 12px 20px; background: #007bff; color: white; border: none; border-radius: 10px; cursor: pointer; width: 95%; font-weight: bold; transition: 0.3s; }
        button:hover { background: #0056b3; transform: translateY(-2px); }
        #avatar { width: 150px; height: 150px; border-radius: 50%; margin-top: 15px; display: none; border: 4px solid #007bff; object-fit: cover; }
        h2 { margin: 15px 0 5px 0; font-size: 1.4em; color: #333; }
        p { color: #888; margin: 0; font-size: 0.9em; background: #f0f0f0; padding: 5px 10px; border-radius: 20px; display: inline-block; }
    </style>
</head>
<body>

    <div class="card">
        <h3>Roblox Discovery</h3>
        <input type="number" id="userIdInput" placeholder="Masukkan User ID (Angka)">
        <button onclick="findProfile()">Lihat Profil</button>

        <div id="result">
            <img id="avatar" src="" alt="Avatar">
            <h2 id="displayName"></h2>
            <p id="infoText">Masukkan ID untuk melihat</p>
        </div>
    </div>

    <script>
        function findProfile() {
            const userId = document.getElementById('userIdInput').value.trim();
            
            if (!userId || isNaN(userId)) {
                return alert("Tolong masukkan ID dalam bentuk angka!");
            }

            const avatarImg = document.getElementById('avatar');
            const infoText = document.getElementById('infoText');
            const dispName = document.getElementById('displayName');

            // TRIK: Langsung tembak CDN Thumbnail Roblox. 
            // Ini tidak akan kena blokir CORS karena bukan 'fetch' tapi 'image load'
            const cdnUrl = `https://www.roblox.com/headshot-thumbnail/image?userId=${userId}&width=150&height=150&format=png`;
            
            avatarImg.src = cdnUrl;
            avatarImg.style.display = "inline-block";
            
            // Karena kita tidak bisa 'fetch' nama tanpa proxy yang jalan, 
            // kita beri label ID saja agar sistem tetap informatif.
            dispName.innerText = "User ID: " + userId;
            infoText.innerText = "Data dimuat dari rbxcdn.com";
            
            // Jika gambar gagal dimuat (ID salah), beri peringatan
            avatarImg.onerror = function() {
                alert("Gagal memuat gambar. ID mungkin tidak ada.");
                avatarImg.style.display = "none";
            };
        }
    </script>
</body>
</html>
