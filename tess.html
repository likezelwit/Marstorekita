<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://www.paypal.com/sdk/js?client-id=AQq-vLiqrftLbzO3Muz_nVAOES0Yb9bOoUFSe4uShYg-HW5xqVJegBBxytSyc6dQnbLpmOPLVVTe4Kn8&currency=USD"></script>
</head>
<body>
    <div id="paypal-button-container" style="max-width: 300px; margin: 50px auto;"></div>

    <script>
        paypal.Buttons({
            createOrder: function(data, actions) {
                return actions.order.create({
                    purchase_units: [{ amount: { value: '5.00' } }]
                });
            },
            onApprove: function(data, actions) {
                return actions.order.capture().then(function(details) {
                    alert('Pembayaran Berhasil!');
                });
            }
        }).render('#paypal-button-container');
    </script>
</body>
</html>
