<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Profile + Game Pass Creator</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            padding: 20px;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            padding: 35px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            width: 100%;
            max-width: 500px;
        }
        h3 {
            font-size: 1.8em;
            margin-bottom: 20px;
            background: linear-gradient(90deg, #00d4ff, #7b2cbf);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .input-hint {
            font-size: 0.75em;
            color: rgba(255,255,255,0.4);
            margin-bottom: 8px;
            text-align: left;
        }
        input {
            padding: 14px 16px;
            width: 100%;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.2);
            color: #fff;
            font-size: 1em;
            outline: none;
            margin-bottom: 12px;
            transition: all 0.3s;
        }
        input::placeholder { color: rgba(255, 255, 255, 0.4); }
        input:focus {
            border-color: #00d4ff;
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.2);
        }
        button {
            padding: 14px 24px;
            background: linear-gradient(90deg, #007bff, #00d4ff);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            font-size: 1em;
            transition: all 0.3s;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(0, 123, 255, 0.4); }
        button:active { transform: scale(0.98); }
        button:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .spinner {
            display: none;
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255,255,255,0.2);
            border-radius: 50%;
            border-top-color: #00d4ff;
            animation: spin 0.8s linear infinite;
            margin: 15px auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        /* PROFILE SECTION */
        #profileSection {
            margin-top: 25px;
            opacity: 0;
            transform: translateY(15px);
            transition: all 0.5s ease;
        }
        #profileSection.show { opacity: 1; transform: translateY(0); }
        
        #avatar {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            margin: 0 auto 15px;
            border: 4px solid #00d4ff;
            object-fit: cover;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.3);
        }
        #avatar:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 40px rgba(0, 212, 255, 0.5);
        }
        #avatar.loaded { display: block; }
        
        h2 { margin: 10px 0 5px; font-size: 1.5em; color: #fff; word-break: break-word; }
        .username-text { font-size: 1em; color: #00d4ff; font-weight: 600; }
        .user-id-text { font-size: 0.8em; color: rgba(255,255,255,0.4); margin-top: 4px; }
        .verified-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: rgba(0,212,255,0.15);
            color: #00d4ff;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75em;
            font-weight: bold;
            margin-top: 8px;
        }
        .click-hint {
            font-size: 0.7em;
            color: rgba(255,255,255,0.4);
            margin-top: 8px;
            font-style: italic;
        }

        /* GAMES LIST */
        #gamesSection {
            margin-top: 25px;
            display: none;
        }
        #gamesSection.show { display: block; }
        
        .games-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .games-header h4 {
            font-size: 1.1em;
            color: #00d4ff;
        }
        .games-count {
            font-size: 0.8em;
            color: rgba(255,255,255,0.5);
            background: rgba(0,0,0,0.2);
            padding: 4px 10px;
            border-radius: 12px;
        }
        
        .game-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 12px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: left;
        }
        .game-item:hover {
            background: rgba(0, 212, 255, 0.1);
            border-color: rgba(0, 212, 255, 0.3);
            transform: translateX(5px);
        }
        .game-thumb {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            object-fit: cover;
            background: rgba(0,0,0,0.3);
        }
        .game-info {
            flex: 1;
        }
        .game-name {
            font-size: 0.95em;
            font-weight: 600;
            color: #fff;
            margin-bottom: 4px;
        }
        .game-players {
            font-size: 0.75em;
            color: rgba(255,255,255,0.5);
        }
        .game-arrow {
            color: rgba(255,255,255,0.3);
            font-size: 1.2em;
        }

        /* GAME PASS MODAL */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-overlay.show { display: flex; }
        
        .modal-content {
            background: #1a1a2e;
            border-radius: 20px;
            width: 100%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .modal-header {
            padding: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-header h3 {
            margin: 0;
            font-size: 1.3em;
        }
        .close-btn {
            background: none;
            border: none;
            color: rgba(255,255,255,0.5);
            font-size: 1.5em;
            cursor: pointer;
            width: auto;
            padding: 0;
        }
        .close-btn:hover { color: #fff; }
        
        .modal-body {
            padding: 20px;
        }
        
        /* Game Pass Creator Form */
        .pass-preview {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
            padding: 15px;
            background: rgba(0,0,0,0.2);
            border-radius: 12px;
        }
        .pass-image {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, #302b63, #24243e);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3em;
        }
        .pass-details {
            flex: 1;
        }
        .pass-details h4 {
            font-size: 1.2em;
            margin-bottom: 8px;
        }
        .pass-details p {
            font-size: 0.85em;
            color: rgba(255,255,255,0.6);
            line-height: 1.5;
        }
        
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .form-group label {
            display: block;
            font-size: 0.85em;
            color: rgba(255,255,255,0.7);
            margin-bottom: 8px;
            font-weight: 600;
        }
        .form-group input[type="text"],
        .form-group input[type="number"] {
            margin-bottom: 0;
        }
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.2);
            color: #fff;
            font-size: 0.9em;
            outline: none;
            resize: vertical;
            min-height: 80px;
            font-family: inherit;
        }
        
        .price-section {
            background: rgba(0,0,0,0.2);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        .price-display {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }
        .price-display input {
            width: 120px;
            text-align: center;
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 0;
        }
        .robux-icon {
            color: #00b06f;
            font-size: 1.3em;
        }
        .earnings-calc {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 15px;
            border-top: 1px solid rgba(255,255,255,0.1);
            font-size: 0.9em;
        }
        .earnings-calc .label {
            color: rgba(255,255,255,0.6);
        }
        .earnings-calc .value {
            color: #ffd43b;
            font-weight: bold;
            font-size: 1.1em;
        }
        
        .toggle-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .toggle-label {
            font-size: 0.9em;
            color: rgba(255,255,255,0.8);
        }
        .toggle-switch {
            position: relative;
            width: 50px;
            height: 26px;
            background: rgba(255,255,255,0.1);
            border-radius: 13px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .toggle-switch.active {
            background: #00d4ff;
        }
        .toggle-switch::after {
            content: '';
            position: absolute;
            width: 22px;
            height: 22px;
            background: #fff;
            border-radius: 50%;
            top: 2px;
            left: 2px;
            transition: all 0.3s;
        }
        .toggle-switch.active::after {
            left: 26px;
        }
        
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }
        .btn-cancel {
            flex: 1;
            padding: 14px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.2);
            color: rgba(255,255,255,0.7);
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.9em;
            font-weight: 600;
        }
        .btn-cancel:hover {
            background: rgba(255,255,255,0.1);
        }
        .btn-save {
            flex: 2;
            padding: 14px;
            background: linear-gradient(90deg, #ff4444, #ff6b6b);
            border: none;
            color: #fff;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.9em;
            font-weight: bold;
        }
        .btn-save:hover {
            box-shadow: 0 5px 20px rgba(255, 68, 68, 0.4);
        }
        
        .back-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: rgba(255,255,255,0.6);
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 15px;
            font-size: 0.85em;
            width: auto;
        }
        .back-btn:hover {
            background: rgba(255,255,255,0.1);
            color: #fff;
        }

        .status-text {
            font-size: 0.85em;
            color: rgba(255,255,255,0.5);
            margin-top: 10px;
            padding: 8px 14px;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            display: inline-block;
        }
        .error { color: #ff6b6b; background: rgba(255,107,107,0.1); }
        .success { color: #51cf66; background: rgba(81,207,102,0.1); }
    </style>
</head>
<body>

    <div class="card">
        <h3>🔍 Roblox Profile + Game Pass</h3>
        
        <div class="input-hint">Masukkan Username atau User ID Roblox</div>
        <input type="text" id="userInput" placeholder="Contoh: Roblox, Builderman, 1" onkeypress="if(event.key==='Enter')findProfile()">
        <button onclick="findProfile()" id="searchBtn">Cari Profil</button>
        <div class="spinner" id="spinner"></div>

        <!-- Profile Section -->
        <div id="profileSection">
            <img id="avatar" src="" alt="Avatar" onclick="showGames()" title="Klik untuk lihat game places">
            <h2 id="displayName"></h2>
            <div id="username" class="username-text"></div>
            <div id="userId" class="user-id-text"></div>
            <div id="verifiedBadge"></div>
            <div class="click-hint">👆 Klik avatar untuk lihat game places</div>
            <div id="status" class="status-text"></div>
        </div>

        <!-- Games List Section -->
        <div id="gamesSection">
            <div class="games-header">
                <h4>🎮 Game Places</h4>
                <span class="games-count" id="gamesCount">0 games</span>
            </div>
            <div id="gamesList"></div>
            <button class="back-btn" onclick="hideGames()">← Kembali ke Profil</button>
        </div>
    </div>

    <!-- Game Pass Creator Modal -->
    <div class="modal-overlay" id="gamePassModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>🎫 Buat Game Pass</h3>
                <button class="close-btn" onclick="closeModal()">×</button>
            </div>
            <div class="modal-body">
                <div class="pass-preview">
                    <div class="pass-image" id="passImage">🎮</div>
                    <div class="pass-details">
                        <h4 id="passGameName">Game Name</h4>
                        <p>Buat game pass untuk game ini. Game pass akan muncul di inventory pembeli.</p>
                    </div>
                </div>

                <div class="form-group">
                    <label>Nama Game Pass</label>
                    <input type="text" id="passName" placeholder="Contoh: VIP Access, Premium Rank">
                </div>

                <div class="form-group">
                    <label>Deskripsi (Opsional)</label>
                    <textarea id="passDesc" placeholder="Jelaskan keuntungan game pass ini..."></textarea>
                </div>

                <div class="toggle-row">
                    <span class="toggle-label">Item for Sale</span>
                    <div class="toggle-switch active" id="saleToggle" onclick="toggleSale()"></div>
                </div>

                <div class="price-section" id="priceSection">
                    <div class="price-display">
                        <span class="robux-icon">💰</span>
                        <input type="number" id="passPrice" value="71" min="1" max="1000000" onchange="updateEarnings()">
                        <span>R$</span>
                    </div>
                    <div class="earnings-calc">
                        <span class="label">Creator Earnings (70%)</span>
                        <span class="value" id="earningsDisplay">50 R$</span>
                    </div>
                </div>

                <div class="btn-group">
                    <button class="btn-cancel" onclick="closeModal()">CANCEL</button>
                    <button class="btn-save" onclick="createGamePass()">SAVE CHANGES</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // CONFIG
        // ============================================
        const API_BASE = '/api/roblox?url=';
        let currentUserId = null;
        let currentGame = null;
        let gamesData = [];

        // ============================================
        // PROFILE FUNCTIONS
        // ============================================
        async function findProfile() {
            const input = document.getElementById('userInput').value.trim();
            const btn = document.getElementById('searchBtn');
            const spinner = document.getElementById('spinner');
            const profileSection = document.getElementById('profileSection');

            if (!input) {
                alert("Masukkan Username atau User ID!");
                return;
            }

            btn.disabled = true;
            btn.innerText = "Mencari...";
            spinner.style.display = "block";
            profileSection.classList.remove('show');

            try {
                let userId, userData, headshotUrl;

                // Cek apakah input angka (User ID) atau username
                if (!isNaN(input) && parseInt(input) > 0) {
                    userId = parseInt(input);
                    userData = await fetchUserData(userId);
                } else {
                    userId = await getUserIdFromUsername(input);
                    userData = await fetchUserData(userId);
                }

                headshotUrl = await fetchHeadshotUrl(userId);
                currentUserId = userId;

                // Display
                document.getElementById('avatar').src = headshotUrl;
                document.getElementById('displayName').innerText = userData.displayName || userData.name;
                document.getElementById('username').innerText = "@" + userData.name;
                document.getElementById('userId').innerText = `User ID: ${userData.id}`;
                
                const verifiedBadge = document.getElementById('verifiedBadge');
                if (userData.hasVerifiedBadge) {
                    verifiedBadge.innerHTML = `<div class="verified-badge">✓ Verified</div>`;
                } else {
                    verifiedBadge.innerHTML = '';
                }

                document.getElementById('status').innerText = "✅ Klik avatar untuk lihat game places";
                document.getElementById('status').className = "status-text success";

                profileSection.classList.add('show');

            } catch (error) {
                console.error(error);
                alert("Error: " + error.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "Cari Profil";
                spinner.style.display = "none";
            }
        }

        async function getUserIdFromUsername(username) {
            const cleanUsername = username.replace(/\s+/g, '').toLowerCase();
            const data = await apiCall(`https://users.roblox.com/v1/users/search?keyword=${encodeURIComponent(cleanUsername)}&limit=10`);

            if (!data.data || data.data.length === 0) {
                throw new Error(`Username "${cleanUsername}" tidak ditemukan`);
            }
            const exactMatch = data.data.find(u => u.name.toLowerCase() === cleanUsername);
            return exactMatch ? exactMatch.id : data.data[0].id;
        }

        async function fetchUserData(userId) {
            const data = await apiCall(`https://users.roblox.com/v1/users/${userId}`);
            if (data.errors) throw new Error(data.errors[0]?.message);
            return data;
        }

        async function fetchHeadshotUrl(userId) {
            const data = await apiCall(`https://thumbnails.roblox.com/v1/users/avatar-headshot?userIds=${userId}&size=420x420&format=Png&isCircular=false`);
            if (!data.data || !data.data[0]?.imageUrl) throw new Error('Avatar tidak tersedia');
            return data.data[0].imageUrl;
        }

        async function apiCall(url) {
            const response = await fetch(API_BASE + encodeURIComponent(url), {
                headers: { 'Accept': 'application/json' }
            });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            return response.json();
        }

        // ============================================
        // GAMES LIST (Klik Avatar)
        // ============================================
        async function showGames() {
            if (!currentUserId) return;
            
            const profileSection = document.getElementById('profileSection');
            const gamesSection = document.getElementById('gamesSection');
            const gamesList = document.getElementById('gamesList');
            
            profileSection.style.display = 'none';
            gamesSection.classList.add('show');
            gamesList.innerHTML = '<div class="spinner" style="display:block;"></div>';

            try {
                // Fetch games dari Roblox API
                const games = await fetchUserGames(currentUserId);
                gamesData = games;

                document.getElementById('gamesCount').innerText = `${games.length} games`;

                if (games.length === 0) {
                    gamesList.innerHTML = '<p style="color:rgba(255,255,255,0.5);padding:20px;">User ini tidak memiliki game places.</p>';
                    return;
                }

                gamesList.innerHTML = games.map(game => `
                    <div class="game-item" onclick="openGamePassModal(${game.id}, '${game.name.replace(/'/g, "\\'")}')">
                        <img class="game-thumb" src="${game.thumbnail || 'https://tr.rbxcdn.com/placeholder.png'}" 
                             onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2260%22 height=%2260%22><rect width=%2260%22 height=%2260%22 fill=%22%23333%22/><text x=%2230%22 y=%2230%22 text-anchor=%22middle%22 fill=%22%23666%22 font-size=%2220%22>🎮</text></svg>'">
                        <div class="game-info">
                            <div class="game-name">${game.name}</div>
                            <div class="game-players">👥 ${game.playing || 0} playing • 🏗️ ${game.placeVisits || 0} visits</div>
                        </div>
                        <div class="game-arrow">›</div>
                    </div>
                `).join('');

            } catch (error) {
                gamesList.innerHTML = `<p style="color:#ff6b6b;padding:20px;">Error: ${error.message}</p>`;
            }
        }

        async function fetchUserGames(userId) {
            // Roblox Games API - fetch games yang dimiliki user
            try {
                const data = await apiCall(`https://games.roblox.com/v2/users/${userId}/games?sortOrder=Asc&limit=50`);
                return data.data || [];
            } catch (error) {
                console.warn("Games API failed, trying alternative...");
                // Fallback: coba dari inventory atau profile
                return [];
            }
        }

        function hideGames() {
            document.getElementById('gamesSection').classList.remove('show');
            document.getElementById('profileSection').style.display = 'block';
        }

        // ============================================
        // GAME PASS MODAL
        // ============================================
        function openGamePassModal(gameId, gameName) {
            currentGame = { id: gameId, name: gameName };
            
            document.getElementById('passGameName').innerText = gameName;
            document.getElementById('passName').value = '';
            document.getElementById('passDesc').value = '';
            document.getElementById('passPrice').value = 71;
            updateEarnings();
            
            // Reset toggle
            document.getElementById('saleToggle').classList.add('active');
            document.getElementById('priceSection').style.display = 'block';
            
            document.getElementById('gamePassModal').classList.add('show');
        }

        function closeModal() {
            document.getElementById('gamePassModal').classList.remove('show');
        }

        function toggleSale() {
            const toggle = document.getElementById('saleToggle');
            const priceSection = document.getElementById('priceSection');
            
            toggle.classList.toggle('active');
            
            if (toggle.classList.contains('active')) {
                priceSection.style.display = 'block';
            } else {
                priceSection.style.display = 'none';
            }
        }

        function updateEarnings() {
            const price = parseInt(document.getElementById('passPrice').value) || 0;
            const earnings = Math.floor(price * 0.7); // 70% creator earnings
            document.getElementById('earningsDisplay').innerText = `${earnings} R$`;
        }

        async function createGamePass() {
            const passName = document.getElementById('passName').value.trim();
            const passDesc = document.getElementById('passDesc').value.trim();
            const passPrice = parseInt(document.getElementById('passPrice').value) || 0;
            const isForSale = document.getElementById('saleToggle').classList.contains('active');

            if (!passName) {
                alert("Masukkan nama game pass!");
                return;
            }

            if (isForSale && passPrice < 1) {
                alert("Harga minimal 1 R$!");
                return;
            }

            // Simulasi pembuatan game pass (karena Roblox API tidak memungkinkan pembuatan via third-party)
            alert(`🎫 Game Pass Created!\n\n` +
                  `Game: ${currentGame.name}\n` +
                  `Pass Name: ${passName}\n` +
                  `Price: ${isForSale ? passPrice + ' R$' : 'Not for sale'}\n` +
                  `Earnings: ${isForSale ? Math.floor(passPrice * 0.7) + ' R$ (70%)' : 'N/A'}\n\n` +
                  `Note: Ini adalah simulasi UI. Untuk membuat game pass sungguhan, Anda perlu login ke Roblox Studio atau website Roblox.`);

            closeModal();
        }

        // Close modal on outside click
        document.getElementById('gamePassModal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });
    </script>
</body>
</html>
