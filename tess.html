<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Profile Finder</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            padding: 20px;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            padding: 35px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            width: 100%;
            max-width: 400px;
        }
        h3 {
            font-size: 1.8em;
            margin-bottom: 20px;
            background: linear-gradient(90deg, #00d4ff, #7b2cbf);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        input {
            padding: 14px 16px;
            width: 100%;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.2);
            color: #fff;
            font-size: 1em;
            outline: none;
            margin-bottom: 12px;
            transition: all 0.3s;
        }
        input::placeholder { color: rgba(255, 255, 255, 0.4); }
        input:focus {
            border-color: #00d4ff;
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.2);
        }
        button {
            padding: 14px 24px;
            background: linear-gradient(90deg, #007bff, #00d4ff);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            font-size: 1em;
            transition: all 0.3s;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(0, 123, 255, 0.4); }
        button:active { transform: scale(0.98); }
        button:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .spinner {
            display: none;
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255,255,255,0.2);
            border-radius: 50%;
            border-top-color: #00d4ff;
            animation: spin 0.8s linear infinite;
            margin: 15px auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #result {
            margin-top: 25px;
            opacity: 0;
            transform: translateY(15px);
            transition: all 0.5s ease;
        }
        #result.show { opacity: 1; transform: translateY(0); }
        #avatar {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            margin: 0 auto 15px;
            border: 4px solid #00d4ff;
            object-fit: cover;
            display: none;
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.3);
        }
        #avatar.loaded { display: block; }
        h2 { margin: 10px 0 5px; font-size: 1.5em; color: #fff; word-break: break-word; }
        .username-text { font-size: 1em; color: #00d4ff; font-weight: 600; }
        .status-text {
            font-size: 0.85em;
            color: rgba(255,255,255,0.5);
            margin-top: 10px;
            padding: 8px 14px;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            display: inline-block;
        }
        .error { color: #ff6b6b; background: rgba(255,107,107,0.1); }
        .success { color: #51cf66; background: rgba(81,207,102,0.1); }
        .verified-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: rgba(0,212,255,0.15);
            color: #00d4ff;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75em;
            font-weight: bold;
            margin-top: 8px;
        }
        .proxy-info {
            font-size: 0.7em;
            color: rgba(255,255,255,0.3);
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h3>🔍 Roblox Profile Finder</h3>
        <input type="text" id="userInput" placeholder="Masukkan User ID (Angka)" onkeypress="if(event.key==='Enter')findProfile()">
        <button onclick="findProfile()" id="searchBtn">Cari Profil</button>
        <div class="spinner" id="spinner"></div>
        
        <div id="result">
            <img id="avatar" src="" alt="Avatar" onload="this.classList.add('loaded')">
            <h2 id="displayName"></h2>
            <div id="username" class="username-text"></div>
            <div id="verifiedBadge"></div>
            <div id="status" class="status-text"></div>
        </div>
        <div class="proxy-info" id="proxyInfo"></div>
    </div>

    <script>
        // ============================================
        // DAFTAR PROXY CORS PUBLIK (diurutkan prioritas)
        // ============================================
        const PROXIES = [
            {
                name: "CORS.sh",
                users: (id) => `https://cors.sh/https://users.roblox.com/v1/users/${id}`,
                thumbnails: (id) => `https://cors.sh/https://thumbnails.roblox.com/v1/users/avatar-headshot?userIds=${id}&size=420x420&format=Png&isCircular=false`
            },
            {
                name: "CORSProxy.io",
                users: (id) => `https://corsproxy.io/?https://users.roblox.com/v1/users/${id}`,
                thumbnails: (id) => `https://corsproxy.io/?https://thumbnails.roblox.com/v1/users/avatar-headshot?userIds=${id}&size=420x420&format=Png&isCircular=false`
            },
            {
                name: "AllOrigins",
                users: (id) => `https://api.allorigins.win/get?url=${encodeURIComponent(`https://users.roblox.com/v1/users/${id}`)}`,
                thumbnails: (id) => `https://api.allorigins.win/get?url=${encodeURIComponent(`https://thumbnails.roblox.com/v1/users/avatar-headshot?userIds=${id}&size=420x420&format=Png&isCircular=false`)}`,
                wrapResponse: true
            },
            {
                name: "ThingProxy",
                users: (id) => `https://thingproxy.freeboard.io/fetch/https://users.roblox.com/v1/users/${id}`,
                thumbnails: (id) => `https://thingproxy.freeboard.io/fetch/https://thumbnails.roblox.com/v1/users/avatar-headshot?userIds=${id}&size=420x420&format=Png&isCircular=false`
            }
        ];

        // ============================================
        // FUNGSI UTAMA
        // ============================================
        async function findProfile() {
            const input = document.getElementById('userInput').value.trim();
            const btn = document.getElementById('searchBtn');
            const spinner = document.getElementById('spinner');
            const result = document.getElementById('result');
            const avatarImg = document.getElementById('avatar');
            const dispName = document.getElementById('displayName');
            const usernameEl = document.getElementById('username');
            const statusEl = document.getElementById('status');
            const verifiedBadge = document.getElementById('verifiedBadge');
            const proxyInfo = document.getElementById('proxyInfo');

            // Validasi
            if (!input || isNaN(input) || parseInt(input) <= 0) {
                alert("Tolong masukkan User ID berupa ANGKA yang valid!");
                return;
            }
            const userId = parseInt(input);

            // Reset UI
            btn.disabled = true;
            btn.innerText = "Mencari...";
            spinner.style.display = "block";
            result.classList.remove('show');
            avatarImg.classList.remove('loaded');
            avatarImg.src = "";
            dispName.innerText = "";
            usernameEl.innerText = "";
            statusEl.innerText = "";
            statusEl.className = "status-text";
            verifiedBadge.innerHTML = "";
            proxyInfo.innerText = "";

            try {
                // Coba semua proxy secara berurutan sampai berhasil
                const userData = await fetchWithFallback(userId, 'users');
                const headshotData = await fetchWithFallback(userId, 'thumbnails');

                // Tampilkan hasil
                dispName.innerText = userData.displayName || userData.name;
                usernameEl.innerText = "@" + userData.name;
                
                if (userData.hasVerifiedBadge) {
                    verifiedBadge.innerHTML = `<div class="verified-badge">✓ Verified</div>`;
                }

                avatarImg.src = headshotData;
                statusEl.innerText = "✅ Profil ditemukan!";
                statusEl.className = "status-text success";

                setTimeout(() => result.classList.add('show'), 100);

            } catch (error) {
                console.error("Error:", error);
                dispName.innerText = "❌ Gagal Memuat";
                statusEl.innerText = error.message || "Semua proxy gagal. Coba lagi nanti.";
                statusEl.className = "status-text error";
                result.classList.add('show');
            } finally {
                btn.disabled = false;
                btn.innerText = "Cari Profil";
                spinner.style.display = "none";
            }
        }

        // ============================================
        // FETCH DENGAN FALLBACK OTOMATIS
        // ============================================
        async function fetchWithFallback(userId, type) {
            const proxyInfo = document.getElementById('proxyInfo');
            let lastError = null;

            for (let i = 0; i < PROXIES.length; i++) {
                const proxy = PROXIES[i];
                try {
                    proxyInfo.innerText = `Mencoba proxy: ${proxy.name}...`;

                    const url = type === 'users' ? proxy.users(userId) : proxy.thumbnails(userId);
                    
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 8000); // 8 detik timeout

                    const response = await fetch(url, {
                        method: 'GET',
                        headers: { 'Accept': 'application/json' },
                        signal: controller.signal
                    });
                    
                    clearTimeout(timeoutId);

                    if (!response.ok) {
                        if (response.status === 429) throw new Error('Rate limited');
                        throw new Error(`HTTP ${response.status}`);
                    }

                    const data = proxy.wrapResponse ? await response.json() : await response.json();
                    
                    // Parse jika menggunakan AllOrigins (wrapResponse)
                    const parsedData = proxy.wrapResponse ? JSON.parse(data.contents) : data;

                    // Validasi data
                    if (type === 'users') {
                        if (parsedData.errors) throw new Error(parsedData.errors[0]?.message || 'User tidak ditemukan');
                        proxyInfo.innerText = `✅ Menggunakan proxy: ${proxy.name}`;
                        return parsedData;
                    } else {
                        // Thumbnails
                        if (!parsedData.data || !parsedData.data[0] || !parsedData.data[0].imageUrl) {
                            throw new Error('URL headshot tidak tersedia');
                        }
                        proxyInfo.innerText = `✅ Menggunakan proxy: ${proxy.name}`;
                        return parsedData.data[0].imageUrl;
                    }

                } catch (error) {
                    lastError = error;
                    console.warn(`Proxy ${proxy.name} gagal:`, error.message);
                    proxyInfo.innerText = `❌ ${proxy.name} gagal, mencoba proxy lain...`;
                    
                    // Tunggu sedikit sebelum pindah ke proxy berikutnya (kecuali yang terakhir)
                    if (i < PROXIES.length - 1) {
                        await new Promise(r => setTimeout(r, 500));
                    }
                }
            }

            throw new Error(`Semua proxy gagal. Error terakhir: ${lastError?.message}`);
        }
    </script>
</body>
</html>
