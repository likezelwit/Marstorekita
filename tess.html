<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Roblox Discovery - Final Fix</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 50px; background: #f4f7f9; }
        .card { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; width: 320px; }
        input { padding: 12px; width: 85%; border: 2px solid #eee; border-radius: 10px; margin-bottom: 12px; }
        button { padding: 12px 20px; background: #007bff; color: white; border: none; border-radius: 10px; cursor: pointer; width: 95%; font-weight: bold; }
        #avatar { width: 150px; height: 150px; border-radius: 50%; margin-top: 15px; display: none; border: 4px solid #007bff; }
    </style>
</head>
<body>

    <div class="card">
        <h3>Roblox Profile</h3>
        <input type="text" id="userInput" placeholder="Masukkan User ID (Angka)">
        <button onclick="findProfile()">Cari Profil</button>
        <div id="result">
            <img id="avatar" src="" alt="Avatar">
            <h2 id="displayName"></h2>
        </div>
    </div>

    <script>
        function findProfile() {
            const input = document.getElementById('userInput').value.trim();
            if (!input || isNaN(input)) return alert("Tolong masukkan User ID berupa ANGKA dulu!");

            const avatarImg = document.getElementById('avatar');
            const dispName = document.getElementById('displayName');

            // 1. TAMPILKAN GAMBAR (Ini 100% aman dari CORS karena pakai tag <img>)
            const cdnUrl = `https://www.roblox.com/headshot-thumbnail/image?userId=${input}&width=150&height=150&format=png`;
            avatarImg.src = cdnUrl;
            avatarImg.style.display = "inline-block";
            dispName.innerText = "Loading Name...";

            // 2. AMBIL NAMA (Trik JSONP via Google Apps Script agar TIDAK kena CORS)
            // Ganti URL ini dengan URL Web App Google Script kamu yang baru dideploy
            const scriptUrl = "https://script.google.com/macros/s/AKfycbw-rlh89wXtS_57q6vTALvvYAkdlAB5j83rAUqvLg160lUAnnV839abGlqx0X7TVQkMcA/exec";
            
            const finalUrl = `${scriptUrl}?url=${encodeURIComponent('https://users.roblox.com/v1/users/' + input)}&callback=callbackFunc`;

            // Kita pakai tag <script> buat ambil data, bukan FETCH. Tag <script> kebal CORS!
            const script = document.createElement('script');
            script.src = finalUrl;
            document.body.appendChild(script);
        }

        // Fungsi penampung hasil dari Google Script
        function callbackFunc(data) {
            if (data.displayName) {
                document.getElementById('displayName').innerText = data.displayName;
            } else {
                document.getElementById('displayName').innerText = "User Found";
            }
        }
    </script>
</body>
</html>
