<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Profile Finder - By Username</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            padding: 20px;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            padding: 35px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            width: 100%;
            max-width: 420px;
        }
        h3 {
            font-size: 1.8em;
            margin-bottom: 20px;
            background: linear-gradient(90deg, #00d4ff, #7b2cbf);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .input-hint {
            font-size: 0.75em;
            color: rgba(255,255,255,0.4);
            margin-bottom: 8px;
            text-align: left;
        }
        input {
            padding: 14px 16px;
            width: 100%;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.2);
            color: #fff;
            font-size: 1em;
            outline: none;
            margin-bottom: 12px;
            transition: all 0.3s;
        }
        input::placeholder { color: rgba(255, 255, 255, 0.4); }
        input:focus {
            border-color: #00d4ff;
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.2);
        }
        button {
            padding: 14px 24px;
            background: linear-gradient(90deg, #007bff, #00d4ff);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            font-size: 1em;
            transition: all 0.3s;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(0, 123, 255, 0.4); }
        button:active { transform: scale(0.98); }
        button:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .spinner {
            display: none;
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255,255,255,0.2);
            border-radius: 50%;
            border-top-color: #00d4ff;
            animation: spin 0.8s linear infinite;
            margin: 15px auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #result {
            margin-top: 25px;
            opacity: 0;
            transform: translateY(15px);
            transition: all 0.5s ease;
        }
        #result.show { opacity: 1; transform: translateY(0); }
        #avatar {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            margin: 0 auto 15px;
            border: 4px solid #00d4ff;
            object-fit: cover;
            display: none;
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.3);
        }
        #avatar.loaded { display: block; }
        h2 { margin: 10px 0 5px; font-size: 1.5em; color: #fff; word-break: break-word; }
        .username-text { font-size: 1em; color: #00d4ff; font-weight: 600; }
        .user-id-text { 
            font-size: 0.8em; 
            color: rgba(255,255,255,0.4); 
            margin-top: 4px;
        }
        .status-text {
            font-size: 0.85em;
            color: rgba(255,255,255,0.5);
            margin-top: 10px;
            padding: 8px 14px;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            display: inline-block;
        }
        .error { color: #ff6b6b; background: rgba(255,107,107,0.1); }
        .success { color: #51cf66; background: rgba(81,207,102,0.1); }
        .verified-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: rgba(0,212,255,0.15);
            color: #00d4ff;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75em;
            font-weight: bold;
            margin-top: 8px;
        }
        .proxy-info {
            font-size: 0.7em;
            color: rgba(255,255,255,0.3);
            margin-top: 15px;
        }
        .step-info {
            font-size: 0.75em;
            color: rgba(255,255,255,0.5);
            margin-top: 5px;
            font-style: italic;
        }
        .mode-toggle {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }
        .mode-btn {
            flex: 1;
            padding: 8px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            color: rgba(255,255,255,0.5);
            cursor: pointer;
            font-size: 0.85em;
            transition: all 0.3s;
        }
        .mode-btn.active {
            background: rgba(0, 212, 255, 0.2);
            border-color: #00d4ff;
            color: #00d4ff;
        }
    </style>
</head>
<body>

    <div class="card">
        <h3>🔍 Roblox Profile Finder</h3>
        
        <div class="mode-toggle">
            <button class="mode-btn active" id="modeUsername" onclick="setMode('username')">By Username</button>
            <button class="mode-btn" id="modeId" onclick="setMode('id')">By User ID</button>
        </div>

        <div class="input-hint" id="inputHint">Masukkan Username Roblox (bukan Display Name)</div>
        <input type="text" id="userInput" placeholder="Contoh: Roblox, Builderman, Stickmasterluke" onkeypress="if(event.key==='Enter')findProfile()">
        <button onclick="findProfile()" id="searchBtn">Cari Profil</button>
        <div class="spinner" id="spinner"></div>
        <div class="step-info" id="stepInfo"></div>
        
        <div id="result">
            <img id="avatar" src="" alt="Avatar" onload="this.classList.add('loaded')">
            <h2 id="displayName"></h2>
            <div id="username" class="username-text"></div>
            <div id="userId" class="user-id-text"></div>
            <div id="verifiedBadge"></div>
            <div id="status" class="status-text"></div>
        </div>
        <div class="proxy-info" id="proxyInfo"></div>
    </div>

    <script>
        // ============================================
        // KONFIGURASI & STATE
        // ============================================
        let searchMode = 'username'; // 'username' atau 'id'
        
        // Proxy yang support GET dengan baik
        const PROXIES = [
            {
                name: "Corsfix",
                get: (url) => `https://proxy.corsfix.com/?${url}`,
                supportsPost: false
            },
            {
                name: "AllOrigins",
                get: (url) => `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`,
                wrapResponse: true,
                supportsPost: false
            },
            {
                name: "CORSProxy.io",
                get: (url) => `https://corsproxy.io/?${encodeURIComponent(url)}`,
                supportsPost: true
            }
        ];

        // ============================================
        // UI FUNCTIONS
        // ============================================
        function setMode(mode) {
            searchMode = mode;
            document.getElementById('modeUsername').classList.toggle('active', mode === 'username');
            document.getElementById('modeId').classList.toggle('active', mode === 'id');
            
            const input = document.getElementById('userInput');
            const hint = document.getElementById('inputHint');
            
            if (mode === 'username') {
                input.placeholder = "Contoh: Roblox, Builderman, Stickmasterluke";
                hint.innerText = "Masukkan Username Roblox (bukan Display Name)";
            } else {
                input.placeholder = "Contoh: 1, 156, 9229907018";
                hint.innerText = "Masukkan User ID Roblox (Angka)";
            }
        }

        // ============================================
        // FUNGSI UTAMA
        // ============================================
        async function findProfile() {
            const input = document.getElementById('userInput').value.trim();
            const btn = document.getElementById('searchBtn');
            const spinner = document.getElementById('spinner');
            const result = document.getElementById('result');
            const avatarImg = document.getElementById('avatar');
            const dispName = document.getElementById('displayName');
            const usernameEl = document.getElementById('username');
            const userIdEl = document.getElementById('userId');
            const statusEl = document.getElementById('status');
            const verifiedBadge = document.getElementById('verifiedBadge');
            const proxyInfo = document.getElementById('proxyInfo');
            const stepInfo = document.getElementById('stepInfo');

            // Validasi
            if (!input) {
                alert(searchMode === 'username' ? "Tolong masukkan Username Roblox!" : "Tolong masukkan User ID!");
                return;
            }

            // Reset UI
            btn.disabled = true;
            btn.innerText = "Mencari...";
            spinner.style.display = "block";
            result.classList.remove('show');
            avatarImg.classList.remove('loaded');
            avatarImg.src = "";
            dispName.innerText = "";
            usernameEl.innerText = "";
            userIdEl.innerText = "";
            statusEl.innerText = "";
            statusEl.className = "status-text";
            verifiedBadge.innerHTML = "";
            proxyInfo.innerText = "";
            stepInfo.innerText = "";

            try {
                let userId;
                let userData;
                let headshotUrl;

                if (searchMode === 'username') {
                    // MODE USERNAME: Gunakan teknik redirect URL untuk dapat User ID
                    stepInfo.innerText = "🔎 Mengkonversi username ke User ID...";
                    userId = await getUserIdFromUsernameRedirect(input);
                    
                    stepInfo.innerText = "📋 Mengambil detail profil...";
                    userData = await fetchUserData(userId);
                    
                    stepInfo.innerText = "🖼️ Mengambil avatar...";
                    headshotUrl = await fetchHeadshotUrl(userId);
                } else {
                    // MODE USER ID
                    const parsedId = parseInt(input);
                    if (isNaN(parsedId) || parsedId <= 0) {
                        throw new Error("User ID harus berupa angka positif!");
                    }
                    userId = parsedId;
                    
                    stepInfo.innerText = "📋 Mengambil detail profil...";
                    userData = await fetchUserData(userId);
                    
                    stepInfo.innerText = "🖼️ Mengambil avatar...";
                    headshotUrl = await fetchHeadshotUrl(userId);
                }

                // Tampilkan hasil
                dispName.innerText = userData.displayName || userData.name;
                usernameEl.innerText = "@" + userData.name;
                userIdEl.innerText = `User ID: ${userData.id}`;
                
                if (userData.hasVerifiedBadge) {
                    verifiedBadge.innerHTML = `<div class="verified-badge">✓ Verified</div>`;
                }

                avatarImg.src = headshotUrl;
                statusEl.innerText = "✅ Profil ditemukan!";
                statusEl.className = "status-text success";
                stepInfo.innerText = "";

                setTimeout(() => result.classList.add('show'), 100);

            } catch (error) {
                console.error("Error:", error);
                dispName.innerText = "❌ Gagal Memuat";
                statusEl.innerText = error.message || "Terjadi kesalahan. Coba lagi nanti.";
                statusEl.className = "status-text error";
                stepInfo.innerText = "";
                result.classList.add('show');
            } finally {
                btn.disabled = false;
                btn.innerText = "Cari Profil";
                spinner.style.display = "none";
            }
        }

        // ============================================
        // TEKNIK BARU: Username ke User ID via Redirect
        // Menggunakan https://www.roblox.com/users/profile?username=NAME
        // Roblox akan redirect ke URL dengan User ID
        // ============================================
        async function getUserIdFromUsernameRedirect(username) {
            // Normalisasi username
            const cleanUsername = username.replace(/\s+/g, '').toLowerCase();
            const profileUrl = `https://www.roblox.com/users/profile?username=${encodeURIComponent(cleanUsername)}`;
            
            for (let i = 0; i < PROXIES.length; i++) {
                const proxy = PROXIES[i];
                try {
                    const proxyUrl = proxy.get(profileUrl);
                    
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 15000);

                    const response = await fetch(proxyUrl, {
                        method: 'GET',
                        redirect: 'follow',
                        signal: controller.signal
                    });
                    
                    clearTimeout(timeoutId);

                    if (!response.ok) {
                        if (response.status === 429) throw new Error('Rate limited');
                        throw new Error(`HTTP ${response.status}`);
                    }

                    let finalUrl;
                    
                    if (proxy.wrapResponse) {
                        // AllOrigins: perlu ekstrak URL dari response
                        const data = await response.json();
                        // AllOrigins tidak mengikuti redirect, tapi kita bisa cek status
                        if (data.status?.http_code === 302 || data.status?.http_code === 301) {
                            // Coba ekstrak Location header
                            const location = data.status?.headers?.Location || data.status?.headers?.location;
                            if (location) {
                                const match = location.match(/\/users\/(\d+)\//);
                                if (match) return parseInt(match[1]);
                            }
                        }
                        throw new Error('AllOrigins tidak mengikuti redirect');
                    } else {
                        // Proxy lain yang mengikuti redirect
                        finalUrl = response.url;
                    }

                    // Ekstrak User ID dari URL final
                    const match = finalUrl.match(/\/users\/(\d+)\//);
                    if (!match) {
                        throw new Error(`Username "${cleanUsername}" tidak ditemukan`);
                    }

                    return parseInt(match[1]);

                } catch (error) {
                    console.warn(`Proxy ${proxy.name} gagal (redirect):`, error.message);
                    if (i < PROXIES.length - 1) await new Promise(r => setTimeout(r, 800));
                }
            }

            // FALLBACK: Gunakan endpoint search API (GET)
            return await getUserIdFromSearch(cleanUsername);
        }

        // ============================================
        // FALLBACK: Gunakan Search API (GET)
        // ============================================
        async function getUserIdFromSearch(username) {
            const searchUrl = `https://users.roblox.com/v1/users/search?keyword=${encodeURIComponent(username)}&limit=1`;
            
            for (let i = 0; i < PROXIES.length; i++) {
                const proxy = PROXIES[i];
                try {
                    const proxyUrl = proxy.get(searchUrl);
                    
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 10000);

                    const response = await fetch(proxyUrl, {
                        method: 'GET',
                        headers: { 'Accept': 'application/json' },
                        signal: controller.signal
                    });
                    
                    clearTimeout(timeoutId);

                    if (!response.ok) throw new Error(`HTTP ${response.status}`);

                    let data;
                    if (proxy.wrapResponse) {
                        const wrapped = await response.json();
                        data = JSON.parse(wrapped.contents);
                    } else {
                        data = await response.json();
                    }

                    if (!data.data || data.data.length === 0) {
                        throw new Error(`Username "${username}" tidak ditemukan`);
                    }

                    // Cek exact match
                    const exactMatch = data.data.find(u => u.name.toLowerCase() === username.toLowerCase());
                    if (exactMatch) return exactMatch.id;
                    
                    // Jika tidak exact match, gunakan hasil pertama
                    return data.data[0].id;

                } catch (error) {
                    console.warn(`Proxy ${proxy.name} gagal (search):`, error.message);
                    if (i < PROXIES.length - 1) await new Promise(r => setTimeout(r, 600));
                }
            }

            throw new Error(`Username "${username}" tidak ditemukan atau semua proxy gagal`);
        }

        // ============================================
        // FETCH DATA USER
        // ============================================
        async function fetchUserData(userId) {
            const url = `https://users.roblox.com/v1/users/${userId}`;

            for (let i = 0; i < PROXIES.length; i++) {
                const proxy = PROXIES[i];
                try {
                    const proxyUrl = proxy.get(url);
                    
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 10000);

                    const response = await fetch(proxyUrl, {
                        method: 'GET',
                        headers: { 'Accept': 'application/json' },
                        signal: controller.signal
                    });
                    
                    clearTimeout(timeoutId);

                    if (!response.ok) throw new Error(`HTTP ${response.status}`);

                    let data;
                    if (proxy.wrapResponse) {
                        const wrapped = await response.json();
                        data = JSON.parse(wrapped.contents);
                    } else {
                        data = await response.json();
                    }

                    if (data.errors) throw new Error(data.errors[0]?.message || 'User tidak ditemukan');
                    return data;

                } catch (error) {
                    console.warn(`Proxy ${proxy.name} gagal (user data):`, error.message);
                    if (i < PROXIES.length - 1) await new Promise(r => setTimeout(r, 600));
                }
            }
            throw new Error('Gagal mengambil data user');
        }

        // ============================================
        // FETCH AVATAR HEADSHOT
        // ============================================
        async function fetchHeadshotUrl(userId) {
            const url = `https://thumbnails.roblox.com/v1/users/avatar-headshot?userIds=${userId}&size=420x420&format=Png&isCircular=false`;

            for (let i = 0; i < PROXIES.length; i++) {
                const proxy = PROXIES[i];
                try {
                    const proxyUrl = proxy.get(url);
                    
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 10000);

                    const response = await fetch(proxyUrl, {
                        method: 'GET',
                        headers: { 'Accept': 'application/json' },
                        signal: controller.signal
                    });
                    
                    clearTimeout(timeoutId);

                    if (!response.ok) throw new Error(`HTTP ${response.status}`);

                    let data;
                    if (proxy.wrapResponse) {
                        const wrapped = await response.json();
                        data = JSON.parse(wrapped.contents);
                    } else {
                        data = await response.json();
                    }

                    if (!data.data || !data.data[0] || !data.data[0].imageUrl) {
                        throw new Error('URL headshot tidak tersedia');
                    }
                    return data.data[0].imageUrl;

                } catch (error) {
                    console.warn(`Proxy ${proxy.name} gagal (thumbnail):`, error.message);
                    if (i < PROXIES.length - 1) await new Promise(r => setTimeout(r, 600));
                }
            }
            throw new Error('Gagal mengambil avatar');
        }
    </script>
</body>
</html>
