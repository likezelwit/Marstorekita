<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PayPal Test - Marstorekita</title>
    <script src="https://www.paypal.com/sdk/js?client-id=Abs1uneKUaR7cv_AJLNk38p0fF5PzL_m9z7NA9tNxlKi-0-BnCULHgl54eS8A7agg3ivOQMiVisCncCI&currency=USD"></script>
    
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #f4f4f9; }
        .payment-card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; width: 100%; max-width: 400px; }
        h2 { color: #333; }
        .price { font-size: 24px; font-weight: bold; color: #0070ba; margin: 20px 0; }
    </style>
</head>
<body>

    <div class="payment-card">
        <h2>Checkout Item</h2>
        <p>Proyek: Marstorekita</p>
        <div class="price">$10.00 USD</div>

        <div id="paypal-button-container"></div>
    </div>

    <script>
        // 3. LOGIKA TOMBOL
        paypal.Buttons({
            // Set up transaksi
            createOrder: function(data, actions) {
                return actions.order.create({
                    purchase_units: [{
                        amount: {
                            value: '10.00' // Harga yang akan dibayar
                        }
                    }]
                });
            },

            // Eksekusi setelah pembeli setuju
            onApprove: function(data, actions) {
                return actions.order.capture().then(function(details) {
                    alert('Pembayaran Berhasil! Terima kasih, ' + details.payer.name.given_name);
                    console.log('Detail Transaksi:', details);
                    // Gilang bisa tambah logika di sini, misal: kirim data ke database
                });
            },

            // Jika pembeli membatalkan
            onCancel: function (data) {
                alert('Pembayaran dibatalkan.');
            },

            // Jika terjadi error sistem
            onError: function (err) {
                console.error('PayPal Error:', err);
                alert('Terjadi kesalahan sistem saat memproses pembayaran.');
            }
        }).render('#paypal-button-container');
    </script>
</body>
</html>
